name: Build cTrader Algorithms

on:
  workflow_dispatch:
    inputs:
      robot_folder:
        description: 'Target Robot Folder Name (e.g., Grid)'
        required: true
        default: 'Grid'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Keep 8.0 or 6.0 based on your preference; SDK 8 easily builds .NET 6 apps

      - name: Verify Robot Path
        run: |
          TARGET_DIR="Robots/${{ github.event.inputs.robot_folder }}"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: Folder '$TARGET_DIR' does not exist."
            exit 1
          fi

      - name: Build and Auto-Package .algo
        run: |
          mkdir -p artifacts
          TARGET_DIR="Robots/${{ github.event.inputs.robot_folder }}"
          
          # Find the specific .csproj file for the chosen robot
          PROJECT_FILE=$(find "$TARGET_DIR" -name "*.csproj" | head -n1)
          echo "Building and packaging: $PROJECT_FILE"
          
          # Running standard build automatically generates the official .algo file via NuGet 1.0.17+
          dotnet build "$PROJECT_FILE" -c Release

          # Find the automatically generated .algo file and copy it to our clean artifacts folder
          find "$TARGET_DIR" -name "*.algo" -exec cp {} artifacts/ \;

      - name: Upload Official .algo Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.robot_folder }}-algo
          path: artifacts/*.algo
          if-no-files-found: error
