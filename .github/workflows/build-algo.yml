name: Build cTrader Algorithms

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Robots
        run: |
          mkdir -p artifacts

          for project in $(find Robots -name "*.csproj"); do
            echo "Building $project"
            
            # Restore and build the project cleanly
            dotnet restore "$project"
            dotnet build "$project" --configuration Release --no-restore

            # Extract the folder and bot name
            folder=$(dirname "$project")
            name=$(basename "$project" .csproj)

            # Find the compiled binary dll files and copy them to artifacts
            find "$folder/bin/Release/" -name "*.dll" -exec cp {} artifacts/ \; || true
          done

      - name: Upload Compiled Bots
        uses: actions/upload-artifact@v4
        with:
          name: cTrader-compiled-robots
          path: artifacts/
