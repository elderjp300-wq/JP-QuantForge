name: Build cTrader Algorithms

on:
  workflow_dispatch:
    inputs:
      robot_folder:
        description: 'Target Robot Folder Name (e.g., Grid, LinearRegressionInterceptV6)'
        required: true
        default: 'Grid'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify Robot Path
        run: |
          TARGET_DIR="Robots/${{ github.event.inputs.robot_folder }}"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: Folder '$TARGET_DIR' does not exist in the repository."
            exit 1
          fi

      - name: Build Targeted Robot
        run: |
          mkdir -p artifacts
          TARGET_DIR="Robots/${{ github.event.inputs.robot_folder }}"
          
          # Find and build only the .csproj files inside the specified folder
          for project in $(find "$TARGET_DIR" -name "*.csproj"); do
            echo "Building targeted project: $project"
            
            dotnet restore "$project"
            dotnet build "$project" --configuration Release --no-restore

            folder=$(dirname "$project")
            
            # Extract compiled assembly .dll outputs
            find "$folder/bin/Release/" -name "*.dll" -exec cp {} artifacts/ \; || true
          done

      - name: Upload Compiled Bot
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.robot_folder }}-compiled
          path: artifacts/
