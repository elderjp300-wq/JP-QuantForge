name: Build cTrader Algorithms

on:
  workflow_dispatch:
    inputs:
      robot_folder:
        description: 'Target Robot Folder Name (e.g., Grid)'
        required: true
        default: 'Grid'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify Robot Path
        run: |
          TARGET_DIR="Robots/${{ github.event.inputs.robot_folder }}"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: Folder '$TARGET_DIR' does not exist."
            exit 1
          fi

      - name: Build & Package Robot
        run: |
          mkdir -p artifacts
          TARGET_DIR="Robots/${{ github.event.inputs.robot_folder }}"
          
          # 1. Build to check for errors (Compiles the DLL)
          echo "Compiling $TARGET_DIR to check for errors..."
          dotnet restore "$TARGET_DIR"
          dotnet build "$TARGET_DIR" --configuration Release --no-restore

          # 2. Create the .algo file (Zip the source code)
          # We zip the folder containing the .csproj and .cs files
          # cTrader Mobile uses this to install/cloud-compile the bot
          
          BOT_NAME="${{ github.event.inputs.robot_folder }}"
          
          echo "Packaging $BOT_NAME.algo..."
          
          # Navigate to the Robots folder so the zip path is clean (e.g., Grid/Grid.cs)
          cd Robots
          
          # Zip the specific bot folder recursively, excluding the bin/obj folders to keep it clean
          zip -r "../artifacts/$BOT_NAME.algo" "$BOT_NAME" -x "*/bin/*" "*/obj/*" "*/.git/*"

      - name: Upload .algo Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.robot_folder }}-algo
          path: artifacts/*.algo
